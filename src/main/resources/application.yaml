spring:
  application:
    name: metrada
  datasource:
    url: jdbc:postgresql://localhost:5432/metrada
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false

server:
  port: 8091
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true
      prometheus:
        enabled: true
    tags:
      application: "metrada"
      environment: "${spring.profiles.active:default}"
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    version: "@project.version@"
    description: "Metrada Metrics API"
  java:
    version: "@java.version@"
